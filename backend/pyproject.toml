[project]
name = "hackathon-team-search-backend"
version = "2.0.0"
description = "API платформы поиска и формирования команд для хакатонов ITAM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-telegram-bot>=21",
    # app/bot.py ходит в API через httpx напрямую, а не только через telegram-bot
    "httpx>=0.28",
]

# Приложение не пакет: запускается как `uvicorn app.main:app`
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Один event loop на всю сессию: пул соединений asyncpg привязан к loop
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Конфиг nginx для docker-compose: /api проксируется на сервис backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    # add_header внутри location отменяет заголовки уровня server, поэтому
    # безопасные заголовки повторяются в каждом location, который что-то отдаёт сам.
    # HSTS здесь не ставится: TLS терминируется на внешнем прокси, заголовок добавляйте там.
    # CSP: шрифты Google Fonts, inline-стили нужны Vue (:style) и SVG-фильтру.

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        # index.html не кешируем: в нём ссылки на хешированные ассеты текущей сборки
        add_header Cache-Control "no-cache" always;
    }

    # Ассеты Vite лежат в /assets/ и имеют хеш в имени, поэтому кешируются навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем, а не дополняем: клиент не может подсунуть свой X-Forwarded-For,
        # а API берёт последний адрес (TRUSTED_PROXY_HOPS=1)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        # Ответы API не кешируем и не индексируем
        add_header Cache-Control "no-store" always;
    }
}
